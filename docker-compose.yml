services:
  comic-app:
    build: .
    container_name: comic-app
    user: "1000:1000"          # write files into ./data as the host user, not root
    environment:
      - DATA_DIR=/data
      - PORT=3000
      - COMIC_VINE_API_KEY=${COMIC_VINE_API_KEY:-}
      - MAX_UPLOAD_BYTES=5368709120
    volumes:
      - ./data:/data
    ports:
      - "8090:3000"          # browse at http://<host>:8090 (host 3000 is taken by Guitar Assistant)
    restart: unless-stopped
