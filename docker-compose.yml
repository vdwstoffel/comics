services:
  comic-app:
    build: .
    container_name: comic-app
    user: "1000:1000"          # write files into ./data as the host user, not root
    environment:
      - DATA_DIR=/data
      - PORT=3000
      - MAX_UPLOAD_BYTES=5368709120
    volumes:
      - ./data:/data
    ports:
      # The app always listens on 3000 inside the container; the left-hand number is the
      # only part that is a choice. Change it if 8090 is already in use on your host.
      - "8090:3000"          # browse at http://<host>:8090
    restart: unless-stopped
